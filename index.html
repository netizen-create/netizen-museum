<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Цифровой музей NETIZEN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@400&display=swap">
<link rel="preload" href="museum/fonts/FeatureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="museum/fonts/FeatureMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Интерфейс поверх сцены набран Feature Mono, как квиз и админка NETIZEN. Файлы урезаны до латиницы и кириллицы, ~30 КБ каждый.
     Geologica и JetBrains Mono остаются для надписей внутри залов (этикетки, автоматы рисуются на холстах). */
  @font-face { font-family: "Feature Mono"; src: url("museum/fonts/FeatureMono-Regular.woff2") format("woff2"); font-weight: 100 400; font-display: swap; }
  @font-face { font-family: "Feature Mono"; src: url("museum/fonts/FeatureMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Feature Mono"; src: url("museum/fonts/FeatureMono-Bold.woff2") format("woff2"); font-weight: 600 900; font-display: swap; }
  /* Лист этикетки поверх тёмной сцены: интерфейс почти исчезает, цвет ссылки остаётся единственным акцентом */
  :root {
    --void: #07080a;
    --glass: rgba(10, 11, 14, .62);
    --line: rgba(236, 233, 226, .16);
    --paper: #ece9e2;
    --dim: #a3a199;
    --link: #2f5bff;
    --sans: "Feature Mono", ui-monospace, monospace;
    --mono: "Feature Mono", ui-monospace, monospace;
    --gut-l: max(16px, env(safe-area-inset-left, 0px));
    --gut-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--void); color: var(--paper); font-family: var(--sans); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity .7s; cursor: grab; }
  #view.drawing { cursor: crosshair; }
  body.ready #view { opacity: 1; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 400 13px var(--mono); color: var(--dim); }
  body.ready #loading { display: none; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, .34)); }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 5; }
  #fade.on { opacity: 1; }
  /* Бэкрумс: счётчик, кнопка выхода, джойстик на телефоне, затемнение по краям, экран поимки и победы. */
  #br { display: none; }
  body.br #br { display: block; }
  body.br #tools, body.br #cap, body.br #hint, body.br #mark { display: none !important; }
  #brTop { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%); z-index: 3; display: flex; gap: 14px; padding: 9px 18px; border-radius: 24px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #f4f1e8; font-size: 13px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  #brTime { opacity: .7; font-variant-numeric: tabular-nums; }
  #brQuit { position: fixed; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 3; padding: 9px 16px; border-radius: 24px; border: 0; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #f4f1e8; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  #brRun { display: none; }
  @media (pointer: coarse) {
    #brRun { display: block; position: fixed; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); width: 76px; height: 76px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .18); background: rgba(10, 11, 14, .5); color: #f4f1e8; font: inherit; font-size: 13px; font-weight: 600; z-index: 3; }
    #brRun.on { background: #f4f1e8; color: #111; }
    #brTop { left: var(--gut-l); transform: none; }
  }
  /* Общая стена: редактор поверх сцены, клетки крупно, палитра и кнопка снизу. */
  #px { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; background: #101115; }
  body.pxOn #tools, body.pxOn #cap, body.pxOn #hint, body.pxOn #top { display: none !important; }
  #pxTop { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gut-r) 10px var(--gut-l); }
  #pxTop b { display: block; font-size: 14px; font-weight: 600; }
  #pxInfo { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  #pxX { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--paper); font: 400 22px var(--sans); cursor: pointer; }
  #pxCv { flex: 1; min-height: 0; width: 100%; touch-action: none; cursor: crosshair; }
  #pxZoom { position: absolute; right: var(--gut-r); top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 8px; }
  #pxZoom button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--paper); font: 500 20px var(--sans); cursor: pointer; }
  #pxBar { padding: 10px var(--gut-r) calc(env(safe-area-inset-bottom, 0px) + 14px) var(--gut-l); display: grid; gap: 10px; background: rgba(10, 11, 14, .9); border-top: 1px solid var(--line); }
  #pxHint { margin: 0; font-size: 12px; color: var(--dim); min-height: 15px; }
  #pxPal { display: grid; grid-template-columns: repeat(16, minmax(0, 34px)); justify-content: center; gap: 5px; }
  @media (max-width: 600px) { #pxPal { grid-template-columns: repeat(8, 1fr); } }
  #pxPal button { aspect-ratio: 1; min-height: 26px; border-radius: 6px; border: 2px solid rgba(255, 255, 255, .12); background: var(--c); cursor: pointer; padding: 0; }
  #pxPal button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px #111 inset; }
  #pxGo { width: 100%; max-width: 420px; justify-self: center; height: 46px; border-radius: 23px; border: 0; background: #7af7d6; color: #0b1512; font: 600 15px var(--sans); cursor: pointer; }
  #pxGo:disabled { background: #2a2d33; color: #6f7279; cursor: default; }
  #brVig { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(40, 0, 0, .85) 100%); }
  #brEnd { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(8, 7, 4, .78); }
  #brEnd[hidden] { display: none; }
  #brFace { position: absolute; width: min(70vw, 70vh); opacity: 0; pointer-events: none; }
  #brEnd.lose #brFace { animation: brFace 1.4s ease-out forwards; }
  @keyframes brFace { 0% { opacity: 1; transform: scale(2.4); } 30% { opacity: 1; transform: scale(1.6); } 100% { opacity: .14; transform: scale(1.1); } }
  #brBox { position: relative; max-width: min(360px, calc(100vw - 32px)); padding: 26px 24px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #f4f1e8; text-align: center; opacity: 0; animation: brIn .4s ease-out .9s forwards; }
  #brEnd.win #brBox { animation-delay: .1s; }
  @keyframes brIn { to { opacity: 1; } }
  #brBox h2 { margin: 0 0 8px; font-size: 22px; }
  #brBox p { margin: 0 0 18px; font-size: 14px; opacity: .8; line-height: 1.4; }
  #brAct { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  /* Выбор сложности при входе в лабиринт: правила, управление и три кнопки. */
  #brPick { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px var(--gut-r) 16px var(--gut-l); background: rgba(8, 7, 4, .66); overflow: auto; }
  #brPick[hidden] { display: none; }
  .brCard { max-width: 420px; padding: 24px 22px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #f4f1e8; animation: brIn .3s ease-out both; opacity: 0; }
  .brCard h2 { margin: 0 0 10px; font-size: 20px; }
  .brCard p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; opacity: .85; }
  #brKeys { opacity: .6 !important; }
  #brModes { display: grid; gap: 8px; margin: 16px 0 12px; }
  #brModes button { display: grid; gap: 3px; text-align: left; padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .14); border-left: 4px solid var(--c); background: rgba(255, 255, 255, .06); color: #f4f1e8; font: inherit; cursor: pointer; }
  #brModes button:hover { background: rgba(255, 255, 255, .12); }
  #brModes b { font-size: 15px; font-weight: 600; }
  #brModes span { font-size: 12px; opacity: .7; }
  #brBack { width: 100%; padding: 11px 18px; border-radius: 22px; border: 0; background: rgba(255, 255, 255, .1); color: #f4f1e8; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  #brAct button { padding: 11px 18px; border-radius: 22px; border: 0; background: #f4f1e8; color: #111; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  #brAct button.alt { background: rgba(255, 255, 255, .12); color: #f4f1e8; }

  .hud { position: fixed; display: flex; align-items: center; gap: 8px; z-index: 3; }
  #top { top: calc(env(safe-area-inset-top, 0px) + 12px); left: var(--gut-l); right: var(--gut-r); justify-content: space-between; align-items: flex-start; pointer-events: none; gap: 12px; }
  #top > * { pointer-events: auto; }
  #mark { font-weight: 600; font-size: 12px; letter-spacing: .02em; pointer-events: none; min-width: 0; padding: 9px 18px; border-radius: 24px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); }
  #hallName { display: block; font: 400 12px var(--sans); color: var(--dim); margin-top: 1px; }
  #hallName .fresh { margin-left: 6px; padding: 1px 6px; border-radius: 2px; background: #47c55e; color: #0b0c0d; font: 500 10px var(--mono, ui-monospace, monospace); text-transform: uppercase; letter-spacing: .04em; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .round { position: relative; width: 52px; height: 52px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); }
  .round svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #snd.off .wave { display: none; }
  #snd .mute { display: none; }
  #snd.off .mute { display: inline; }
  #mapN { position: absolute; right: -2px; bottom: -3px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; display: grid; place-items: center; border-radius: 11px; background: #15161a; color: #7bff8c; font: 500 12px var(--mono); border: 1px solid var(--line); }
  #draw[aria-pressed="true"] { background: var(--paper); color: #111; }
  #tools { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 12px; }
  #palette { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 26px; padding: 8px; gap: 6px; }
  #palette button { width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 2px solid transparent; }
  #palette button[aria-pressed="true"] { border-color: var(--paper); }
  #palette .rub { background: repeating-conic-gradient(#777 0 25%, #ddd 0 50%) 50% / 12px 12px; }

  #cap { left: 50%; transform: translate(-50%, 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); max-width: min(420px, calc(100vw - 32px)); display: block; text-align: left; padding: 10px 18px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 24px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #cap.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #capT { display: block; font-weight: 600; font-size: 14px; text-wrap: balance; }
  #capA { display: block; font: 400 12px var(--mono); color: var(--dim); margin-top: 3px; }

  #say { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); width: max-content; max-width: min(520px, calc(100vw - 32px)); z-index: 4; text-align: center; padding: 12px 20px; background: rgba(5, 6, 8, .78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 24px; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; pointer-events: none; }
  #say.on { opacity: 1; visibility: visible; }
  #sayName { display: block; font: 500 12px var(--mono); color: var(--dim); margin-bottom: 3px; }
  #sayLine { font-size: 16px; line-height: 1.35; }

  #hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #fff; background: rgba(40, 40, 44, .56); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 6px 8px 6px 18px; border-radius: 26px; transition: opacity .5s, visibility .5s; width: max-content; max-width: calc(100vw - 32px); }
  #hint svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #hint.off { opacity: 0; visibility: hidden; }
  /* Захваченная мышь: точка прицела в центре, нажатие срабатывает по ней. */
  #cross { display: none; position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .45); z-index: 3; pointer-events: none; }
  body.locked #cross { display: block; }
  body.locked #view { cursor: none; }
  /* Как в oncyber: подсказка у курсора до захвата, а пока мышь захвачена, интерфейс прячется и сверху одна строка, как вернуть курсор. */
  #lookTip { position: fixed; left: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; border-radius: 20px; background: rgba(40, 40, 44, .62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #fff; font-size: 12px; white-space: nowrap; pointer-events: none; }
  #lookTip i { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  #lockBar { display: none; position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%); z-index: 3; padding: 9px 18px; border-radius: 22px; background: rgba(40, 40, 44, .56); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #fff; font-size: 13px; white-space: nowrap; pointer-events: none; }
  body.locked #lockBar { display: block; }
  body.locked #top, body.locked #tools, body.locked #hint { visibility: hidden; }
  body.br.locked #lockBar { display: none; }
  /* Джойстик на телефоне: слева над нижними кнопками. Подписи и реплики поднимаются выше, чтобы его не закрывать. */
  #joy { display: none; }
  @media (pointer: coarse) {
    #joy { display: grid; place-items: center; position: fixed; left: var(--gut-l); bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); width: 116px; height: 116px; border-radius: 50%; background: rgba(10, 11, 14, .32); border: 1px solid rgba(255, 255, 255, .2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 3; touch-action: none; }
    #joy i { width: 48px; height: 48px; border-radius: 50%; background: rgba(244, 241, 232, .82); pointer-events: none; }
    body.br #joy { bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
    body.focusing #joy, body.pxOn #joy { display: none; }
    #cap { bottom: calc(env(safe-area-inset-bottom, 0px) + 224px) !important; }
    #say { bottom: calc(env(safe-area-inset-bottom, 0px) + 290px) !important; }
  }
  #hintX { width: 36px; height: 36px; flex: none; display: grid; place-items: center; }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translate(-50%, -8px); z-index: 4; background: var(--paper); color: #141414; padding: 10px 18px; border-radius: 24px; font-size: 14px; width: max-content; max-width: calc(100vw - 32px); text-wrap: balance; text-align: center; opacity: 0; visibility: hidden; transition: opacity .3s, transform .3s, visibility .3s; pointer-events: none; }
  #toast.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  #toast small { display: block; font: 400 12px var(--mono); margin-top: 2px; }

  #sheet { position: fixed; inset: 0; z-index: 6; background: rgba(5, 6, 8, .6); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); display: grid; place-items: center; padding-block: calc(env(safe-area-inset-top, 0px) + 66px) calc(env(safe-area-inset-bottom, 0px) + 24px); padding-left: var(--gut-l); padding-right: var(--gut-r); overflow: auto; -webkit-user-select: text; user-select: text; }
  #sBody { width: 100%; max-width: 1000px; box-sizing: border-box; }
  #sBody.panel { max-width: 480px; padding: 28px; border-radius: 28px; background: rgba(16, 17, 21, .78); border: 1px solid var(--line); }
  #sBody.panel.wide { max-width: 640px; }
  #sBody h2 { font-weight: 700; font-size: clamp(22px, 3vw, 32px); line-height: 1.14; margin: 0 0 8px; text-wrap: balance; }
  .tech { font: 400 12px var(--mono); color: var(--dim); margin: 4px 0 18px; }
  .txt { font-size: 16px; line-height: 1.5; font-weight: 300; margin: 0 0 16px; max-width: 46ch; }
  .note { font: 400 12px var(--mono); color: var(--dim); margin: 0 0 16px; }
  .eye { font: 500 12px var(--mono); color: var(--dim); margin: 0 0 8px; }
  .field { display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; background: rgba(255, 255, 255, .08); color: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 0 16px; font: 400 16px var(--sans); }
  .btn { min-height: 44px; padding: 0 20px; background: var(--paper); color: #111; border-radius: 22px; font-size: 14px; font-weight: 600; }

  #sBody.game { -webkit-user-select: none; user-select: none; }

  /* Змейка: своя карманная консоль, тёплый пластик, LCD и кнопки под большой палец */
  #sBody.pocketWrap { max-width: min(400px, 100%); }
  .pocket { position: relative; box-sizing: border-box; padding: 16px 16px 20px; border-radius: 22px 22px 56px 22px; background: linear-gradient(160deg, #e2dfc8, #bdb99b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), inset 0 -6px 0 rgba(70, 66, 40, .28), 0 24px 70px rgba(0, 0, 0, .6); }
  .pocketBezel { padding: 16px 16px 8px; border-radius: 12px 12px 34px 12px; background: #2e3129; box-shadow: inset 0 0 0 2px #1c1e19; }
  .lcd { display: block; width: 100%; height: auto; max-height: calc(100vh - 330px); object-fit: contain; image-rendering: pixelated; touch-action: none; background: #cadc9f; box-shadow: inset 0 0 12px rgba(15, 56, 15, .5); }
  .pocketBrand { margin: 7px 0 0; text-align: center; font: 400 14px "Pixelify Sans", var(--sans); letter-spacing: .14em; color: #9aa085; }
  .pocketPad { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 12px 0; }
  .dpad { position: relative; width: 132px; height: 132px; flex: none; }
  .dpad::before { content: ""; position: absolute; left: 46px; top: 46px; width: 40px; height: 40px; background: #24261f; }
  .dpad button { position: absolute; width: 44px; height: 46px; background: #24261f; box-shadow: inset 0 2px 0 #4a4d42, 0 3px 0 #0f100c; touch-action: none; }
  .dpad button:active { background: #3b3e33; transform: translateY(1px); }
  .dU { left: 44px; top: 0; border-radius: 8px 8px 0 0; }
  .dD { left: 44px; bottom: 0; border-radius: 0 0 8px 8px; }
  .dL { left: 0; top: 44px; width: 46px !important; height: 44px !important; border-radius: 8px 0 0 8px; }
  .dR { right: 0; top: 44px; width: 46px !important; height: 44px !important; border-radius: 0 8px 8px 0; }
  .grille { width: 48px; height: 40px; flex: none; background: repeating-linear-gradient(115deg, transparent 0 7px, rgba(50, 46, 26, .5) 7px 11px); }
  .aBtn { width: 72px; height: 72px; flex: none; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #b4d43a, #6c8c0c); color: #24320a; font: 400 28px "Pixelify Sans", var(--sans); box-shadow: 0 4px 0 #3e520a, 0 8px 14px rgba(0, 0, 0, .3); touch-action: none; }
  .aBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #3e520a; }

  /* Пинбол: стекло с табло и стол в хроме */
  #sBody.pinWrap { max-width: min(980px, 100%); }

<script>
  (async function () {
    // Пока грузятся шрифты, сервер проверяет вход и подписку. Без сервера ворота сразу открыты.
    const gate = Net.enter();
    const fonts = ['400 20px "Feature Mono"', '500 20px "Feature Mono"', '700 20px "Feature Mono"', '700 40px Geologica', '300 40px Geologica', '400 40px Geologica', '600 40px Geologica', '800 40px Geologica', '900 40px Geologica', '400 20px "JetBrains Mono"', '500 20px "JetBrains Mono"', '10px "Pixelify Sans"'];
    await Promise.race([
      Promise.all(fonts.map(f => document.fonts.load(f, 'Кэш abc').catch(() => null))),
      new Promise(r => setTimeout(r, 2500))
    ]);
    await gate;
    const s = document.createElement('script');
    s.src = 'museum/app.js';
    s.onload = () => Museum.boot();
    document.body.appendChild(s);
  })();
</script>
